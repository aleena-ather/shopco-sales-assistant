<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cableBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <linearGradient id="metalConnector" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldTip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <pattern id="braidTexture" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="8" fill="#1E293B" />
      <rect x="4" width="4" height="8" fill="#334155" />
    </pattern>
    <filter id="cableShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0B1B3A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#cableBg)" />

  <!-- Ambient Shadows -->
  <ellipse cx="300" cy="380" rx="180" ry="45" fill="#0B1B3A" opacity="0.16" />

  <!-- Coiled Braided Cable Loops -->
  <g filter="url(#cableShadow)">
    <!-- Back Loop -->
    <ellipse cx="300" cy="320" rx="145" ry="85" fill="none" stroke="#1E293B" stroke-width="16" />
    <ellipse cx="300" cy="320" rx="145" ry="85" fill="none" stroke="url(#braidTexture)" stroke-width="14" />

    <!-- Middle Loop -->
    <ellipse cx="300" cy="305" rx="130" ry="75" fill="none" stroke="#0F172A" stroke-width="16" />
    <ellipse cx="300" cy="305" rx="130" ry="75" fill="none" stroke="url(#braidTexture)" stroke-width="14" />

    <!-- Front Loop -->
    <ellipse cx="300" cy="290" rx="115" ry="65" fill="none" stroke="#1E293B" stroke-width="16" />
    <ellipse cx="300" cy="290" rx="115" ry="65" fill="none" stroke="url(#braidTexture)" stroke-width="14" />
  </g>

  <!-- Leather Cable Strap Organizer -->
  <rect x="275" y="225" width="50" height="150" rx="10" fill="#78350F" stroke="#92400E" stroke-width="2" />
  <!-- Strap Button / Snap -->
  <circle cx="300" cy="250" r="8" fill="#D97706" stroke="#B45309" stroke-width="1.5" />
  <circle cx="300" cy="250" r="4" fill="#FDE68A" />

  <!-- Left Cable End: USB-C Input -->
  <g transform="translate(140, 240) rotate(-35)">
    <!-- Braided lead-in -->
    <path d="M 0 60 Q -10 30 0 0" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round" />
    <!-- Flexible Strain Relief Collar -->
    <rect x="-8" y="-18" width="16" height="20" rx="4" fill="#0F172A" />
    <!-- Aluminum Shell -->
    <rect x="-11" y="-60" width="22" height="44" rx="5" fill="url(#metalConnector)" stroke="#475569" stroke-width="1.5" />
    <!-- Blue laser accent band -->
    <rect x="-11" y="-55" width="22" height="3" fill="#2F6BFF" />
    <!-- USB-C Plug Tip -->
    <rect x="-7" y="-78" width="14" height="20" rx="3" fill="#94A3B8" stroke="#CBD5E1" stroke-width="1" />
  </g>

  <!-- Right Cable End: Lightning 8-Pin Tip -->
  <g transform="translate(450, 230) rotate(30)">
    <!-- Braided lead-in -->
    <path d="M 0 60 Q 10 30 0 0" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round" />
    <!-- Flexible Strain Relief Collar -->
    <rect x="-7" y="-18" width="14" height="20" rx="4" fill="#0F172A" />
    <!-- Aluminum Shell -->
    <rect x="-10" y="-58" width="20" height="42" rx="5" fill="url(#metalConnector)" stroke="#475569" stroke-width="1.5" />
    <!-- Blue laser accent band -->
    <rect x="-10" y="-53" width="20" height="3" fill="#2F6BFF" />
    <!-- Gold Lightning 8-Pin Blade -->
    <rect x="-6" y="-74" width="12" height="18" rx="2" fill="url(#goldTip)" stroke="#CA8A04" stroke-width="0.8" />
    <!-- Pin Contact Stripes -->
    <line x1="-4" y1="-68" x2="4" y2="-68" stroke="#713F12" stroke-width="1.5" stroke-dasharray="1.2 1" />
  </g>

  <!-- Text / Badge -->
  <text x="300" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569" letter-spacing="1.5">REINFORCED NYLON BRAID</text>
</svg>

