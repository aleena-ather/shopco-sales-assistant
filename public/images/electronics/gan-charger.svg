<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="ganBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <linearGradient id="chargerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="chargerFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="metalProng" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="chargerShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0B1B3A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#ganBg)" />

  <!-- Ambient Shadow -->
  <ellipse cx="300" cy="425" rx="180" ry="26" fill="#0B1B3A" opacity="0.18" />

  <!-- Wall Prongs (Foldable US / Universal AC pins) on Left -->
  <rect x="150" y="240" width="45" height="12" rx="3" fill="url(#metalProng)" stroke="#64748B" stroke-width="1" />
  <circle cx="160" cy="246" r="2.5" fill="#475569" />
  <rect x="150" y="295" width="45" height="12" rx="3" fill="url(#metalProng)" stroke="#64748B" stroke-width="1" />
  <circle cx="160" cy="301" r="2.5" fill="#475569" />

  <!-- Main Charger Block Enclosure -->
  <rect x="180" y="180" width="230" height="200" rx="24" fill="url(#chargerBody)" filter="url(#chargerShadow)" stroke="#334155" stroke-width="2" />

  <!-- Front Port Plate -->
  <rect x="290" y="195" width="105" height="170" rx="16" fill="url(#chargerFace)" stroke="#475569" stroke-width="1.5" />

  <!-- Power Status LED (Ice Blue) -->
  <circle cx="342" cy="216" r="3.5" fill="#38BDF8" />
  <circle cx="342" cy="216" r="7" fill="#38BDF8" opacity="0.4" />

  <!-- Port 1: USB-C PD 65W Max -->
  <g transform="translate(315, 235)">
    <rect x="0" y="0" width="55" height="16" rx="8" fill="#090D16" stroke="#475569" stroke-width="1" />
    <rect x="18" y="5" width="19" height="6" rx="3" fill="#64748B" />
    <text x="27" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38BDF8">USB-C1 (65W)</text>
  </g>

  <!-- Port 2: USB-C PD 30W -->
  <g transform="translate(315, 280)">
    <rect x="0" y="0" width="55" height="16" rx="8" fill="#090D16" stroke="#475569" stroke-width="1" />
    <rect x="18" y="5" width="19" height="6" rx="3" fill="#64748B" />
    <text x="27" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94A3B8">USB-C2 (30W)</text>
  </g>

  <!-- Port 3: USB-A Fast Charge 18W (Orange Tongue) -->
  <g transform="translate(315, 325)">
    <rect x="0" y="0" width="55" height="18" rx="4" fill="#090D16" stroke="#475569" stroke-width="1" />
    <rect x="5" y="4" width="45" height="5" rx="1.5" fill="#F97316" />
    <text x="27" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#F97316">USB-A (QC)</text>
  </g>

  <!-- GaN III Tech Badge on Body -->
  <g transform="translate(205, 260)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="1">65W</text>
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2F6BFF" letter-spacing="1.5">GaN III FAST</text>
  </g>

  <!-- Subtitle -->
  <text x="300" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569" letter-spacing="1.5">TRIPLE PORT GALLIUM NITRIDE CHARGER</text>
</svg>

