<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgPouch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EEF4FF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <linearGradient id="pouchBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2F6BFF" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="lockBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="pouchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1B3A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#bgPouch)" />

  <!-- Ambient Ground Shadow -->
  <ellipse cx="300" cy="530" rx="140" ry="18" fill="#0B1B3A" opacity="0.14" />

  <!-- Lanyard Neck Strap -->
  <path d="M 300 110 C 300 40, 200 20, 200 0 M 300 110 C 300 40, 400 20, 400 0" 
        fill="none" stroke="#2F6BFF" stroke-width="4" stroke-dasharray="8 4" stroke-linecap="round" opacity="0.85" />
  <!-- Lanyard Ring Clasp -->
  <circle cx="300" cy="116" r="8" fill="none" stroke="#94A3B8" stroke-width="3" />
  <rect x="294" y="122" width="12" height="12" rx="2" fill="#475569" />

  <!-- Transparent Waterproof Pouch Body -->
  <!-- Outer Welded Border Envelope -->
  <rect x="180" y="140" width="240" height="370" rx="28" 
        fill="#FFFFFF" fill-opacity="0.25" 
        stroke="url(#pouchBorder)" stroke-width="6" 
        filter="url(#pouchShadow)" />

  <!-- Interior Transparent Viewing Window -->
  <rect x="194" y="154" width="212" height="342" rx="20" 
        fill="#E0F2FE" fill-opacity="0.2" 
        stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.6" />

  <!-- Phone Resting Safely Inside Pouch -->
  <rect x="215" y="180" width="170" height="290" rx="20" fill="#0F172A" stroke="#334155" stroke-width="2" />
  <!-- Phone Screen with Blue Tech Glow -->
  <rect x="223" y="196" width="154" height="258" rx="14" fill="#0A1128" />
  <circle cx="300" cy="310" r="32" fill="#2F6BFF" opacity="0.2" />
  <path d="M 285 310 L 295 320 L 315 300" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="300" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38BDF8" text-anchor="middle" letter-spacing="1">100% SEALED</text>

  <!-- Top Dual-Swivel Locking Seal Bar -->
  <rect x="170" y="130" width="260" height="36" rx="10" fill="url(#lockBar)" stroke="#475569" stroke-width="1.5" />
  <!-- Swivel Lock Left -->
  <circle cx="210" cy="148" r="9" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
  <rect x="208" y="142" width="4" height="12" rx="1" fill="#FFFFFF" />
  <!-- Swivel Lock Right -->
  <circle cx="390" cy="148" r="9" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
  <rect x="388" y="142" width="4" height="12" rx="1" fill="#FFFFFF" />
  <!-- Center Locking Latch -->
  <rect x="278" y="136" width="44" height="24" rx="5" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="300" y="152" font-family="sans-serif" font-size="9" font-weight="bold" fill="#94A3B8" text-anchor="middle">IPX8</text>

  <!-- Light Reflection Glare Across Transparent Plastic Screen -->
  <polygon points="198,160 270,160 210,380 198,380" fill="#FFFFFF" opacity="0.14" />
  <polygon points="310,160 360,160 270,470 240,470" fill="#FFFFFF" opacity="0.08" />

  <!-- Water Splash / Droplet Accents on Pouch -->
  <ellipse cx="380" cy="240" rx="6" ry="9" transform="rotate(20 380 240)" fill="#38BDF8" opacity="0.75" />
  <circle cx="205" cy="420" r="5" fill="#38BDF8" opacity="0.65" />
  <circle cx="400" cy="460" r="4" fill="#38BDF8" opacity="0.65" />
</svg>

