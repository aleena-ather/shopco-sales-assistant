<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EEF4FF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="clipMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="goldJack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B1B3A" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)" />

  <!-- Ambient Shadow -->
  <ellipse cx="300" cy="460" rx="180" ry="24" fill="#0B1B3A" opacity="0.12" />

  <!-- Flexible Audio Cable Curves -->
  <path d="M 270 290 C 270 380, 210 440, 280 470 C 350 490, 410 440, 420 370 C 428 310, 390 280, 390 220" 
        fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />
  <path d="M 390 220 L 390 190" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round" />

  <!-- 3.5mm Gold Jack Connector Section -->
  <!-- Rubber Barrel -->
  <rect x="382" y="145" width="16" height="46" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <rect x="385" y="150" width="10" height="36" fill="#1E293B" />
  <!-- Gold-Plated Pin with Insulating Rings -->
  <rect x="386" y="95" width="8" height="50" rx="2" fill="url(#goldJack)" />
  <!-- Pin Tip Point -->
  <polygon points="386,96 390,90 394,96" fill="#F59E0B" />
  <!-- Black Insulator Bands -->
  <line x1="386" y1="108" x2="394" y2="108" stroke="#0F172A" stroke-width="2" />
  <line x1="386" y1="120" x2="394" y2="120" stroke="#0F172A" stroke-width="2" />
  <line x1="386" y1="134" x2="394" y2="134" stroke="#0F172A" stroke-width="2" />

  <!-- Lavalier Mic Body & Windscreen Capsule -->
  <!-- Metal Mic Stem Base -->
  <rect x="264" y="248" width="12" height="42" rx="3" fill="url(#clipMetal)" stroke="#1E293B" stroke-width="1" />
  <rect x="262" y="278" width="16" height="6" rx="2" fill="#0F172A" />

  <!-- Alligator Lapel Clip -->
  <!-- Clip Hinge Spring -->
  <circle cx="246" cy="270" r="6" fill="#475569" stroke="#1E293B" stroke-width="1.5" />
  <!-- Clip Arm clamped to mic stem -->
  <rect x="250" y="266" width="16" height="8" rx="2" fill="url(#clipMetal)" />
  <!-- Alligator Clamp Jaw -->
  <path d="M 246 266 L 206 248 C 200 246, 194 252, 196 258 L 204 278 L 244 274 Z" fill="url(#clipMetal)" stroke="#334155" stroke-width="1.5" />
  <!-- Teeth Serrations on Clip -->
  <line x1="198" y1="256" x2="202" y2="256" stroke="#0F172A" stroke-width="2" />
  <line x1="200" y1="264" x2="204" y2="264" stroke="#0F172A" stroke-width="2" />
  <line x1="202" y1="272" x2="206" y2="272" stroke="#0F172A" stroke-width="2" />

  <!-- High-Density Foam Windscreen (Oval Capsule) -->
  <ellipse cx="270" cy="188" rx="36" ry="54" fill="url(#foamGrad)" filter="url(#softShadow)" stroke="#334155" stroke-width="1.5" />
  <!-- Foam Texture Highlight -->
  <ellipse cx="260" cy="174" rx="20" ry="32" fill="#475569" opacity="0.25" />
  <circle cx="270" cy="142" r="3" fill="#64748B" opacity="0.3" />

  <!-- Accent Ring -->
  <ellipse cx="270" cy="238" rx="14" ry="4" fill="#2F6BFF" opacity="0.9" />
</svg>

