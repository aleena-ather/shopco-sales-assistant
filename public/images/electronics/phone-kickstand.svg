<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgKickstand" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EEF4FF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="standMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="40%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="hingeMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="phoneShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="-10" dy="18" stdDeviation="16" flood-color="#0B1B3A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#bgKickstand)" />

  <!-- Ambient Ground Shadow -->
  <ellipse cx="280" cy="480" rx="190" ry="24" fill="#0B1B3A" opacity="0.18" />

  <!-- Propped Phone Chassis in Landscape / Angled View -->
  <!-- Main Phone Body Backplate -->
  <rect x="150" y="150" width="280" height="300" rx="28" 
        transform="rotate(-12 290 300)" 
        fill="url(#phoneBody)" filter="url(#phoneShadow)" stroke="#475569" stroke-width="2" />

  <!-- Subtle Phone Camera Island (Top Left of Phone) -->
  <rect x="170" y="168" width="60" height="74" rx="16" 
        transform="rotate(-12 290 300)" 
        fill="#090D16" stroke="#334155" stroke-width="1.5" />
  <circle cx="216" cy="200" r="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <circle cx="204" cy="235" r="12" fill="#1E293B" stroke="#475569" stroke-width="1" />

  <!-- The Universal Folding Aluminum Kickstand Attached on Back -->
  <!-- Kickstand Base Plate (glued to phone) -->
  <rect x="250" y="270" width="130" height="42" rx="10" 
        transform="rotate(-12 290 300)" 
        fill="#090D16" stroke="#2F6BFF" stroke-width="1.5" opacity="0.9" />

  <!-- Kickstand Hinge Cylinder -->
  <rect x="340" y="272" width="24" height="38" rx="6" 
        transform="rotate(-12 290 300)" 
        fill="url(#hingeMetal)" stroke="#1E293B" stroke-width="1" />

  <!-- Extended Folding Kickstand Leg (Supporting the phone onto the ground) -->
  <polygon points="360,305 440,465 416,470 338,310" 
           fill="url(#standMetal)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Rubberized Non-Slip Foot on Kickstand Leg Tip -->
  <rect x="412" y="460" width="30" height="12" rx="4" 
        transform="rotate(16 427 466)" 
        fill="#090D16" stroke="#475569" stroke-width="1" />

  <!-- Blue Tech Line Accent on Kickstand Arm -->
  <line x1="355" y1="316" x2="425" y2="456" stroke="#2F6BFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Edge Highlight on Phone Body -->
  <path d="M 172 152 L 405 104" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />
</svg>

