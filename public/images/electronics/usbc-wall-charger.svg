<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="wallBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <linearGradient id="wallBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="wallFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="wallShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0B1B3A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#wallBg)" />

  <!-- Ambient Shadow -->
  <ellipse cx="300" cy="425" rx="160" ry="24" fill="#0B1B3A" opacity="0.18" />

  <!-- AC Prongs on Left Side -->
  <rect x="180" y="260" width="45" height="12" rx="3" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1" />
  <circle cx="190" cy="266" r="2.5" fill="#64748B" />
  <rect x="180" y="315" width="45" height="12" rx="3" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1" />
  <circle cx="190" cy="321" r="2.5" fill="#64748B" />

  <!-- Main Wall Adapter Cube -->
  <rect x="210" y="200" width="180" height="180" rx="28" fill="url(#wallBody)" filter="url(#wallShadow)" stroke="#334155" stroke-width="2" />

  <!-- Front Port Recess -->
  <rect x="285" y="220" width="85" height="140" rx="18" fill="url(#wallFace)" stroke="#475569" stroke-width="1.5" />

  <!-- LED Power Indicator (Blue) -->
  <circle cx="327" cy="245" r="3.5" fill="#2F6BFF" />
  <circle cx="327" cy="245" r="7" fill="#2F6BFF" opacity="0.35" />

  <!-- Center USB-C Port -->
  <g transform="translate(302, 275)">
    <rect x="0" y="0" width="50" height="20" rx="10" fill="#090D16" stroke="#475569" stroke-width="1.2" />
    <rect x="15" y="6" width="20" height="8" rx="4" fill="#94A3B8" />
    <rect x="17" y="8" width="16" height="4" rx="2" fill="#0F172A" />
  </g>

  <!-- Power Rating Micro-text -->
  <text x="327" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38BDF8">PD 30W</text>
  <text x="327" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#94A3B8">TYPE-C</text>

  <!-- Side Embossed Text -->
  <text x="245" y="295" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#64748B" transform="rotate(-90 245 295)" letter-spacing="1">FAST CHARGE</text>

  <!-- Subtitle -->
  <text x="300" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569" letter-spacing="1.5">COMPACT 30W USB-C POWER ADAPTER</text>
</svg>

