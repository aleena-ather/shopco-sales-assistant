<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="padBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <linearGradient id="padMatSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <filter id="matShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0B1B3A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#padBg)" />

  <!-- Ambient Shadow on Desk -->
  <ellipse cx="300" cy="410" rx="230" ry="40" fill="#0B1B3A" opacity="0.18" />

  <!-- Extended Desk Mat (Perspective View 900x400mm ratio) -->
  <g filter="url(#matShadow)">
    <!-- Base Mat Body with Stitched Anti-Fray Perimeter -->
    <rect x="60" y="210" width="480" height="200" rx="18" fill="url(#padMatSurface)" stroke="#2F6BFF" stroke-width="2" />
    
    <!-- Stitched Edge Line -->
    <rect x="64" y="214" width="472" height="192" rx="14" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" />

    <!-- Topographic / Geometric Minimalist Accent Lines -->
    <g opacity="0.25">
      <path d="M 60 300 Q 180 250, 300 320 T 540 280" fill="none" stroke="#38BDF8" stroke-width="2" />
      <path d="M 60 320 Q 200 270, 320 340 T 540 300" fill="none" stroke="#38BDF8" stroke-width="1.5" />
      <path d="M 60 340 Q 220 290, 340 360 T 540 320" fill="none" stroke="#2F6BFF" stroke-width="1.5" />
      <path d="M 60 360 Q 240 310, 360 380 T 540 340" fill="none" stroke="#2F6BFF" stroke-width="1" />
      
      <!-- Top Left Topo Accent Circles -->
      <circle cx="150" cy="260" r="45" fill="none" stroke="#38BDF8" stroke-width="1.2" />
      <circle cx="150" cy="260" r="30" fill="none" stroke="#38BDF8" stroke-width="1" />
      <circle cx="150" cy="260" r="15" fill="none" stroke="#38BDF8" stroke-width="0.8" />
    </g>

    <!-- Visual Size & Scale Reference: Keyboard & Mouse Silhouettes on the mat -->
    <!-- Keyboard Area Silhouette -->
    <rect x="90" y="240" width="240" height="95" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" opacity="0.65" />
    <rect x="98" y="248" width="224" height="79" rx="4" fill="#0F172A" opacity="0.5" />
    <!-- Spacebar line -->
    <rect x="160" y="308" width="80" height="8" rx="2" fill="#334155" opacity="0.7" />

    <!-- Mouse Area Silhouette with gliding sensor zone -->
    <g transform="translate(410, 260)" opacity="0.65">
      <path d="M 0 35 C 0 10, 10 0, 22 0 C 34 0, 44 10, 44 35 C 44 55, 34 70, 22 70 C 10 70, 0 55, 0 35 Z" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <line x1="22" y1="5" x2="22" y2="30" stroke="#334155" stroke-width="1.5" />
      <circle cx="22" cy="18" r="4" fill="#2F6BFF" />
    </g>

    <!-- Micro-Weave Water Resistant Badge in Bottom Right of Mat -->
    <g transform="translate(430, 375)">
      <text x="90" y="14" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">900 × 400 MM</text>
    </g>
  </g>

  <!-- Title / Spec -->
  <text x="300" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569" letter-spacing="1.5">ANTI-FRAY STITCHED EXTENDED DESK MAT</text>
</svg>

